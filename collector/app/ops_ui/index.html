<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AE2 Dashboard</title>
</head>
<body>
  <header>
    <div class="title">AE2 Dashboard</div>
    <span class="pill meta" id="meta">loading…</span>
    <div class="right">
      <div class="segmented" id="kindToggle">
        <button class="seg-btn active" data-kind="item">Items</button>
        <button class="seg-btn" data-kind="fluid">Fluids</button>
        <button class="seg-btn" data-kind="gas">Gases</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div id="err" class="err" style="display:none;"></div>

    <div id="viewHeatmap" class="card heatmap-card">
      <h2>Heatmap</h2>
      <div id="heatmapCanvas" class="heatmap-canvas"></div>
      <div class="muted heatmap-empty" id="heatmapEmpty">No data.</div>
    </div>

    <div id="viewList" class="list-section">
      <div class="grid">
        <div class="card">
          <h2>Amount <span class="unit" id="unit-amount"></span></h2>
          <div id="amount"></div>
        </div>
        <div class="card">
          <h2>Growth (/min) <span class="unit" id="unit-growth"></span></h2>
          <div id="growth"></div>
        </div>
        <div class="card">
          <h2>Decrease (/min) <span class="unit" id="unit-decrease"></span></h2>
          <div id="decrease"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const base = "/dashboard/ui/static/ui/dist/";
      const manifestUrl = `${base}manifest.json`;
      const addCss = (href) => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        document.head.appendChild(link);
      };
      const addModule = (src) => {
        const script = document.createElement("script");
        script.type = "module";
        script.src = src;
        document.body.appendChild(script);
      };
      fetch(manifestUrl, { cache: "no-store" })
        .then((res) => {
          if (!res.ok) throw new Error(`manifest fetch failed: ${res.status}`);
          return res.json();
        })
        .then((manifest) => {
          const entry = manifest && manifest["main.js"];
          if (!entry || !entry.file) throw new Error("manifest missing main.js entry");
          if (Array.isArray(entry.css)) {
            entry.css.forEach((file) => addCss(`${base}${file}`));
          }
          addModule(`${base}${entry.file}`);
        })
        .catch((err) => {
          console.error(err);
          const el = document.getElementById("err");
          if (el) {
            el.style.display = "block";
            el.textContent = "UI assets failed to load.";
          }
        });
    })();
  </script>
</body>
</html>
