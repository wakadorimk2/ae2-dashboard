<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AE2 Dashboard</title>
  <link rel="stylesheet" href="/dashboard/ui/static/styles.css" />
</head>
<body>
  <header>
    <div class="title">AE2 Dashboard</div>
    <span class="pill" id="meta">loading…</span>
    <div class="right">
        <label class="pill" style="display:flex; gap:8px; align-items:center;">
        <input id="auto" type="checkbox" />
        <span>Auto</span>
        </label>

        <label class="pill" style="display:flex; gap:8px; align-items:center;">
        <input id="perHour" type="checkbox" />
        <span>/hour</span>
        </label>

        <span class="muted">TopN</span>
        <input id="topn" type="range" min="5" max="20" step="1" value="10" />
        <span class="pill" id="topnVal">10</span>
        <button id="refresh">更新</button>
    </div>
  </header>

  <div class="wrap">
    <div id="err" class="err" style="display:none;"></div>

    <div class="tabs">
      <button class="tab active" data-kind="item">Items</button>
      <button class="tab" data-kind="fluid">Fluids</button>
      <button class="tab" data-kind="gas">Gases</button>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Amount</h2>
        <div id="amount"></div>
      </div>
      <div class="card">
        <h2>Growth (/min)</h2>
        <div id="growth"></div>
      </div>
      <div class="card">
        <h2>Decrease (/min)</h2>
        <div id="decrease"></div>
      </div>
    </div>
  </div>

  <script src="/dashboard/ui/static/app.js"></script>
</body>
</html>
