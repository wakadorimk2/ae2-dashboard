<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AE2 Dashboard</title>
  <link rel="stylesheet" href="/dashboard/ui/static/styles.css" />
</head>
<body>
  <header>
    <div class="title">AE2 Dashboard</div>
    <span class="pill meta" id="meta">loading…</span>
    <div class="right">
      <div class="segmented" id="kindToggle">
        <button class="seg-btn active" data-kind="item">Items</button>
        <button class="seg-btn" data-kind="fluid">Fluids</button>
        <button class="seg-btn" data-kind="gas">Gases</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div id="err" class="err" style="display:none;"></div>

    <div id="viewHeatmap" class="card heatmap-card">
      <h2>Heatmap</h2>
      <div id="heatmapCanvas" class="heatmap-canvas"></div>
      <div class="muted heatmap-empty" id="heatmapEmpty">No data.</div>
    </div>

    <div id="viewList" class="list-section">
      <div class="grid">
        <div class="card">
          <h2>Amount <span class="unit" id="unit-amount"></span></h2>
          <div id="amount"></div>
        </div>
        <div class="card">
          <h2>Growth (/min) <span class="unit" id="unit-growth"></span></h2>
          <div id="growth"></div>
        </div>
        <div class="card">
          <h2>Decrease (/min) <span class="unit" id="unit-decrease"></span></h2>
          <div id="decrease"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/dashboard/ui/static/scale.js"></script>
  <script type="module" src="/dashboard/ui/static/ui/main.js"></script>
</body>
</html>
