<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AE2 Dashboard</title>

  <style>
    /* CSSロード前でも白くしない */
    html, body { height: 100%; }
    body { margin: 0; background: #0b0f16; color: #cbd5e1; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    /* 起動中スプラッシュ（CSSなしでも見える） */
    #boot-splash{
      position: fixed; inset: 0;
      display: grid; place-items: center;
      background: #0b0f16;
      z-index: 9999;
    }
    #boot-splash .box{
      display: grid; gap: 8px; justify-items: center;
      padding: 16px 18px; border-radius: 14px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(15,23,42,.35);
      backdrop-filter: blur(6px);
    }
    #boot-splash .dot{
      width: 10px; height: 10px; border-radius: 999px;
      background: rgba(148,163,184,.7);
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.35; transform:scale(.9)} 50%{opacity:1; transform:scale(1.15)} }
  </style>
</head>
<body>
  <header>
    <div class="title">AE2 Dashboard</div>
    <span class="pill meta" id="meta">loading…</span>
    <div class="right">
      <nav class="segmented view-toggle" id="viewToggle" aria-label="View">
        <a class="seg-btn" data-view="heatmap" href="?view=heatmap">Observe</a>
        <a class="seg-btn" data-view="list" href="?view=list">Inspect</a>
      </nav>
      <div class="segmented" id="kindToggle">
        <button class="seg-btn active" data-kind="item">Items</button>
        <button class="seg-btn" data-kind="fluid">Fluids</button>
        <button class="seg-btn" data-kind="gas">Gases</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div id="err" class="err" style="display:none;"></div>

    <div id="viewHeatmap" class="card heatmap-card">
      <h2>Observe</h2>
      <div id="heatmapCanvas" class="heatmap-canvas"></div>
      <div class="muted heatmap-empty" id="heatmapEmpty">No data.</div>
    </div>

    <div id="viewList" class="list-section is-hidden">
      <div class="inspect-header">
        <h2>Inspect</h2>
        <p class="muted inspect-subtitle">Detailed metrics and comparisons</p>
      </div>
      <div class="grid">
        <div class="card">
          <h2>Amount <span class="unit" id="unit-amount"></span></h2>
          <div id="amount"></div>
        </div>
        <div class="card">
          <h2>Growth (/min) <span class="unit" id="unit-growth"></span></h2>
          <div id="growth"></div>
        </div>
        <div class="card">
          <h2>Decrease (/min) <span class="unit" id="unit-decrease"></span></h2>
          <div id="decrease"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const base = "/dashboard/ui/static/ui/dist/";
      const manifestUrl = `${base}manifest.json`;
      const addCss = (href) => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        document.head.appendChild(link);
      };
      const hideSplash = () => {
        const s = document.getElementById("boot-splash");
        if (s) s.remove();
      };
      const addModule = (src) => {
        const script = document.createElement("script");
        script.type = "module";
        script.src = src;
        script.onload = () => hideSplash();
        document.body.appendChild(script);
      };
      fetch(manifestUrl, { cache: "no-store" })
        .then((res) => {
          if (!res.ok) throw new Error(`manifest fetch failed: ${res.status}`);
          return res.json();
        })
        .then((manifest) => {
          const entry = manifest && manifest["main.js"];
          if (!entry || !entry.file) throw new Error("manifest missing main.js entry");
          if (Array.isArray(entry.css)) {
            entry.css.forEach((file) => addCss(`${base}${file}`));
          }
          addModule(`${base}${entry.file}`);
        })
        .catch((err) => {
          console.error(err);
          const el = document.getElementById("err");
          if (el) {
            el.style.display = "block";
            el.textContent = "UI assets failed to load.";
          }
        });
    })();
  </script>
</body>
</html>
