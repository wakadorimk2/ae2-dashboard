<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AE2 Dashboard</title>
  <link rel="stylesheet" href="/dashboard/ui/static/styles.css" />
</head>
<body>
  <header>
    <div class="title">AE2 Dashboard</div>
    <span class="pill meta" id="meta">loading…</span>
    <div class="right">
        <div class="segmented" id="viewToggle">
          <button class="seg-btn active" data-view="list">List</button>
          <button class="seg-btn" data-view="heatmap">Heatmap</button>
        </div>

        <div class="segmented" id="formatToggle">
          <button class="seg-btn" data-format="raw">Raw</button>
          <button class="seg-btn active" data-format="compact">Compact</button>
        </div>

        <label class="pill" style="display:flex; gap:8px; align-items:center;">
        <input id="perHour" type="checkbox" />
        <span>/hour</span>
        </label>

        <span class="muted">TopN</span>
        <input id="topn" type="range" min="5" max="20" step="1" value="10" />
        <span class="pill" id="topnVal">10</span>
    </div>
  </header>

  <div class="wrap">
    <div id="err" class="err" style="display:none;"></div>

    <div id="summary" class="summary-grid"></div>

    <div id="viewList">
      <div class="tabs">
        <button class="tab active" data-kind="item">Items</button>
        <button class="tab" data-kind="fluid">Fluids</button>
        <button class="tab" data-kind="gas">Gases</button>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Amount <span class="unit" id="unit-amount"></span></h2>
          <div id="amount"></div>
        </div>
        <div class="card">
          <h2>Growth (/min) <span class="unit" id="unit-growth"></span></h2>
          <div id="growth"></div>
        </div>
        <div class="card">
          <h2>Decrease (/min) <span class="unit" id="unit-decrease"></span></h2>
          <div id="decrease"></div>
        </div>
      </div>
    </div>

    <div id="viewHeatmap" class="card" style="display:none;">
      <h2>Heatmap</h2>

      <div class="tabs heatmap-tabs">
        <button class="tab active" data-kind="item">Items</button>
        <button class="tab" data-kind="fluid">Fluids</button>
        <button class="tab" data-kind="gas">Gases</button>
      </div>

      <div class="heatmap-toolbar">
        <div class="segmented" id="heatmapCountToggle">
          <button class="seg-btn" data-count="40">40</button>
          <button class="seg-btn active" data-count="80">80</button>
          <button class="seg-btn" data-count="120">120</button>
        </div>
        <div class="segmented" id="heatmapSortToggle">
          <button class="seg-btn active" data-sort="amount">Amount</button>
          <button class="seg-btn" data-sort="delta">|Delta|</button>
        </div>
      </div>

      <div id="heatmapCanvas" class="heatmap-canvas"></div>
      <div class="muted heatmap-empty" id="heatmapEmpty">No data.</div>
    </div>
  </div>

  <script src="/dashboard/ui/static/scale.js"></script>
  <script type="module" src="/dashboard/ui/static/ui/main.js"></script>
</body>
</html>
