version: 1

groups:
  # --- Sources ---
  - id: water_source
    label: Water (infinite)
    kind: source
    members:
      fingerprints:
        - "fluid:minecraft:water"

  - id: lava_source
    label: Lava (bulk)
    kind: source
    members:
      fingerprints:
        - "fluid:minecraft:lava"

  - id: biomass_input
    label: Biomass inputs (sugarcane/beetroot/melon)
    kind: source

  - id: cobble_source
    label: Cobblestone source (extruder)
    kind: source
    members:
      fingerprints:
        - "item:minecraft:cobblestone"
        - "item:minecraft:cobbled_deepslate"

  - id: ore_input
    label: Ore / Raw input
    kind: source

  # --- Brine / Electrolysis ---
  - id: evaporation
    label: Evaporation Plant
    kind: process
    members:
      fingerprints:
        - "gas:mekanism:water_vapor"
        - "gas:mekanism:steam"

  - id: brine
    label: Brine
    kind: intermediate
    members:
      fingerprints:
        - "fluid:mekanism:brine"

  - id: electrolysis
    label: Electrolysis
    kind: process

  - id: sodium_out
    label: Sodium output
    kind: material
    members:
      fingerprints:
        - "gas:mekanism:sodium"

  - id: chlorine_out
    label: Chlorine output
    kind: material
    members:
      fingerprints:
        - "gas:mekanism:chlorine"

  - id: hydrogen_out
    label: Hydrogen output
    kind: material
    members:
      fingerprints:
        - "gas:mekanism:hydrogen"

  # --- HCl ---
  - id: hcl_out
    label: Hydrogen Chloride (HCl)
    kind: material
    members:
      fingerprints:
        - "gas:mekanism:hydrogen_chloride"
        - "mekanism:hydrogen_chloride"

  # --- Sulfur / Acid (placeholders; you can expand later) ---
  - id: sulfur_out
    label: Sulfur output
    kind: material

  - id: sulfuric_acid_out
    label: Sulfuric Acid
    kind: material
    members:
      fingerprints:
        - "gas:mekanism:sulfuric_acid"
        - "mekanism:sulfuric_acid"
        - "fluid:mekanism:sulfuric_acid"

  # --- Ore 5x (boxed) ---
  - id: ore_preprocess
    label: Ore preprocess (fortune/annihilation/raw block)
    kind: process

  - id: slurry_step
    label: Slurry step (requires sulfuric acid)
    kind: process

  - id: ore_5x_chain
    label: Ore 5x chain (boxed)
    kind: process

  - id: ore_products
    label: Ore products (ingots/etc)
    kind: output

  - id: oxygen_out
    label: Oxygen (if relevant)
    kind: material
    members:
      fingerprints:
        - "gas:mekanism:oxygen"

  # --- Polymer / HDPE ---
  - id: biofuel_out
    label: Biofuel
    kind: material

  - id: substrate_pool
