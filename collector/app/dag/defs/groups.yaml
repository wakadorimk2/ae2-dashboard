  # --- Gunpowder line ---
  - id: gravel_out
    label: Gravel
    kind: material

  - id: flint_out
    label: Flint
    kind: material

  - id: gunpowder_out
    label: Gunpowder
    kind: material

  # --- sector: utility ---
  - id: xp_fluid
    label: Fluid XP
    kind: material
    sector: utility
    members:
      fingerprints:
        - "fluid:mob_grinding_utils:fluid_xp"

  - id: blood_fluid
    label: Blood
    kind: material
    sector: utility
    members:
      fingerprints:
        - "fluid:biomesoplenty:blood"
